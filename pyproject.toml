[project]
name = "confluence-markdown-publisher"
version = "0.1.0"
description = "Local Confluence publisher for Markdown documents with rendered Mermaid diagrams."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "markdown>=3.6,<4",
    "mcp>=1,<2",
    "PyYAML>=6,<7",
]

[project.scripts]
publish-confluence = "confluence_publisher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/confluence_publisher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
